<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5ef" />
    <meta
      name="description"
      content="比较中文写作、界面、视觉设计与配色的真实样本，选出更喜欢的版本，生成可以复制给 AI 的个人风格指南。"
    />
    <title>风格样本室 · 个人风格指南</title>
    <link rel="icon" href="mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="art.css" />
    <link rel="stylesheet" href="visual.css" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4" data-domains="preference-atlas.xiaosang.cc"></script>
    <script defer src="art.js"></script>
    <script defer src="writing.js"></script>
    <script defer src="visual.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#view">跳到主要内容</a>
    <header class="top">
      <div class="bar wrap">
        <a class="wordmark" href="#catalog" aria-label="风格样本室首页"
          ><img src="mark.svg" alt="" />风格样本室</a
        >
        <nav aria-label="主导航">
          <a href="#catalog" id="nav-catalog">样本目录</a
          ><a href="#guides" id="nav-guides"
            ><span class="book-icon" aria-hidden="true"></span>我的指南<span
              id="guide-count"
            ></span
          ></a>
        </nav>
      </div>
    </header>
    <main id="view" class="wrap" tabindex="-1"></main>
    <footer class="wrap">
      <span>风格样本室 v1.0.1</span>
      <a href="https://github.com/holynova/preference-atlas" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span id="storage-label">选择保存在当前浏览器</span
      ><button id="method" type="button">方法来源</button>
    </footer>
    <dialog id="about">
      <button class="dialog-close" aria-label="关闭">×</button>
      <h2>从样本认识偏好</h2>
      <p>
        Matt Pocock 提出两种收集偏好的方式：给单个句子打 1–4 分，或从多个版本中选出更喜欢的一个。一起规划文章后，AI 可以逐句给出样例，检验它对你风格的猜测。
      </p>
      <p>
        样本室使用预先写好的对照。每组点一次即可继续，完成任意一组就能复制指南给自己的 AI。
      </p>
      <a
        href="https://x.com/mattpocockuk/status/2124214098984370645"
        target="_blank"
        rel="noopener noreferrer"
        >阅读原帖 ↗</a
      >
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
